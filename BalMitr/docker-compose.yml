services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-balmitr}
      MYSQL_USER: ${MYSQL_USER:-balmitr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-balmitr_dev_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-balmitr}
      MYSQL_USER: ${MYSQL_USER:-balmitr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-balmitr_dev_pw}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-key-change-me}
      DJANGO_DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r /app/requirements.txt &&
             python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  mysql_data:
